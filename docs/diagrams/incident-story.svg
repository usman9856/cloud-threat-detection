<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#1E293B"/></marker>
</defs>
<rect width="1600" height="880" fill="#FFFFFF"/>
<text x="30" y="44" font-size="28" font-weight="bold" fill="#1E293B">Normal Operation, Attack, Automatic Recovery</text>
<text x="30" y="72" font-size="17" fill="#64748B">CloudTrail log-tampering detection and auto-remediation on AWS</text>
<line x1="30" y1="86" x2="1570" y2="86" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1.5"/>
<rect x="25" y="106" width="350" height="450" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1.5"/>
<rect x="25" y="106" width="350" height="50" rx="8" fill="#047857" fill-opacity="0.12"/>
<line x1="25" y1="156" x2="375" y2="156" stroke="#047857" stroke-width="2.5"/>
<text x="43" y="140" font-size="22" font-weight="bold" fill="#047857">1. NORMAL OPERATION</text>
<rect x="43" y="176" width="314" height="46" rx="6" fill="#047857" fill-opacity="0.12" stroke="#047857" stroke-width="2"/>
<circle cx="69" cy="199" r="9" fill="#047857"/>
<text x="89" y="206" font-size="18" font-weight="bold" fill="#047857">Trail logging: ON</text>
<text x="47" y="262" font-size="17" fill="#1E293B">CloudTrail trail p5-lab-trail</text>
<text x="47" y="291" font-size="17" fill="#1E293B">records account activity to S3.</text>
<text x="47" y="334" font-size="17" font-weight="bold" fill="#1E293B">Watching</text>
<text x="47" y="363" font-size="17" fill="#1E293B">EventBridge rule: ENABLED</text>
<text x="47" y="392" font-size="17" fill="#1E293B">Lambda guard: idle</text>
<text x="47" y="421" font-size="17" fill="#1E293B">SNS p5-alerts: email confirmed</text>
<text x="47" y="464" font-size="17" fill="#64748B">Nothing is happening. The</text>
<text x="47" y="493" font-size="17" fill="#64748B">rule only reacts to two events.</text>
<rect x="425" y="106" width="350" height="450" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1.5"/>
<rect x="425" y="106" width="350" height="50" rx="8" fill="#B91C1C" fill-opacity="0.12"/>
<line x1="425" y1="156" x2="775" y2="156" stroke="#B91C1C" stroke-width="2.5"/>
<text x="443" y="140" font-size="22" font-weight="bold" fill="#B91C1C">2. ATTACK</text>
<rect x="443" y="176" width="314" height="46" rx="6" fill="#B91C1C" fill-opacity="0.12" stroke="#B91C1C" stroke-width="2"/>
<circle cx="469" cy="199" r="9" fill="#B91C1C"/>
<text x="489" y="206" font-size="18" font-weight="bold" fill="#B91C1C">Trail logging: OFF</text>
<text x="447" y="262" font-size="17" fill="#1E293B">An actor with valid credentials</text>
<text x="447" y="291" font-size="17" fill="#1E293B">runs:</text>
<text x="447" y="320" font-size="15" font-family="DejaVu Sans Mono, Consolas, monospace" font-weight="bold" fill="#B91C1C">aws cloudtrail stop-logging</text>
<text x="447" y="363" font-size="17" fill="#1E293B">Goal: stop the record, so later</text>
<text x="447" y="392" font-size="17" fill="#1E293B">actions in the account go unseen.</text>
<text x="447" y="435" font-size="17" font-weight="bold" fill="#1E293B">MITRE ATT&amp;CK  T1562.008</text>
<text x="447" y="464" font-size="17" fill="#64748B">Impair Defenses: Disable or</text>
<text x="447" y="493" font-size="17" fill="#64748B">Modify Cloud Logs</text>
<rect x="825" y="106" width="350" height="450" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1.5"/>
<rect x="825" y="106" width="350" height="50" rx="8" fill="#B45309" fill-opacity="0.12"/>
<line x1="825" y1="156" x2="1175" y2="156" stroke="#B45309" stroke-width="2.5"/>
<text x="843" y="140" font-size="22" font-weight="bold" fill="#B45309">3. DETECT AND RESPOND</text>
<rect x="843" y="176" width="314" height="46" rx="6" fill="#B45309" fill-opacity="0.12" stroke="#B45309" stroke-width="2"/>
<circle cx="869" cy="199" r="9" fill="#B45309"/>
<text x="889" y="206" font-size="18" font-weight="bold" fill="#B45309">Automatic response</text>
<text x="847" y="262" font-size="17" fill="#1E293B">1. CloudTrail records the stop call</text>
<text x="847" y="291" font-size="17" fill="#1E293B">2. Rule p5-logging-tampered matches</text>
<text x="847" y="320" font-size="17" fill="#1E293B">3. Lambda checks the call:</text>
<text x="847" y="349" font-size="17" fill="#64748B">   rejected? lab trail? already on?</text>
<text x="847" y="378" font-size="17" font-weight="bold" fill="#1E293B">4. Lambda calls StartLogging</text>
<text x="847" y="407" font-size="17" fill="#1E293B">5. Lambda publishes the alert</text>
<text x="847" y="436" font-size="17" fill="#64748B">   to SNS p5-alerts</text>
<text x="847" y="479" font-size="17" fill="#64748B">EventBridge calls only the</text>
<text x="847" y="508" font-size="17" fill="#64748B">Lambda. The Lambda emails you.</text>
<rect x="1225" y="106" width="350" height="450" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1.5"/>
<rect x="1225" y="106" width="350" height="50" rx="8" fill="#047857" fill-opacity="0.12"/>
<line x1="1225" y1="156" x2="1575" y2="156" stroke="#047857" stroke-width="2.5"/>
<text x="1243" y="140" font-size="22" font-weight="bold" fill="#047857">4. SYSTEM RESTORED</text>
<rect x="1243" y="176" width="314" height="46" rx="6" fill="#047857" fill-opacity="0.12" stroke="#047857" stroke-width="2"/>
<circle cx="1269" cy="199" r="9" fill="#047857"/>
<text x="1289" y="206" font-size="18" font-weight="bold" fill="#047857">Trail logging: ON</text>
<text x="1247" y="262" font-size="17" font-weight="bold" fill="#1E293B">Before:  logging OFF</text>
<text x="1247" y="291" font-size="17" font-weight="bold" fill="#047857">After:   logging ON</text>
<text x="1247" y="334" font-size="17" fill="#1E293B">Email sent:</text>
<text x="1247" y="363" font-size="15" font-family="DejaVu Sans Mono, Consolas, monospace" font-weight="bold" fill="#1E293B">P5 Attack Detected [HIGH]</text>
<text x="1247" y="406" font-size="17" fill="#1E293B">Record saved: one JSON entry</text>
<text x="1247" y="435" font-size="17" fill="#1E293B">in CloudWatch Logs (who, when,</text>
<text x="1247" y="464" font-size="17" fill="#1E293B">what the system did).</text>
<text x="1247" y="493" font-size="17" fill="#64748B">Next: a person reviews it.</text>
<line x1="379" y1="331" x2="421" y2="331" stroke="#1E293B" stroke-width="3" marker-end="url(#ar)"/>
<line x1="779" y1="331" x2="821" y2="331" stroke="#1E293B" stroke-width="3" marker-end="url(#ar)"/>
<line x1="1179" y1="331" x2="1221" y2="331" stroke="#1E293B" stroke-width="3" marker-end="url(#ar)"/>
<text x="30" y="598" font-size="20" font-weight="bold" fill="#1E293B">Timeline of one test run (UTC, 22 Nov 2026)</text>
<line x1="60" y1="680" x2="700" y2="680" stroke="#047857" stroke-width="8" stroke-linecap="round"/>
<line x1="700" y1="680" x2="900" y2="680" stroke="#B91C1C" stroke-width="8"/>
<line x1="900" y1="680" x2="1540" y2="680" stroke="#047857" stroke-width="8" stroke-linecap="round"/>
<circle cx="700" cy="680" r="13" fill="#FFFFFF" stroke="#B91C1C" stroke-width="4"/>
<circle cx="900" cy="680" r="13" fill="#FFFFFF" stroke="#047857" stroke-width="4"/>
<text x="712" y="640" text-anchor="end" font-size="18" font-weight="bold" fill="#B91C1C">13:03:32  attack</text>
<text x="888" y="640" text-anchor="start" font-size="18" font-weight="bold" fill="#047857">13:03:37  logging restored</text>
<text x="380" y="720" text-anchor="middle" font-size="17" fill="#047857">Logging ON</text>
<text x="800" y="720" text-anchor="middle" font-size="17" font-weight="bold" fill="#B91C1C">OFF for about 6 s</text>
<text x="1220" y="720" text-anchor="middle" font-size="17" fill="#047857">Logging ON</text>
<line x1="30" y1="770" x2="1570" y2="770" stroke="#1E293B" stroke-opacity="0.25" stroke-width="1"/>
<text x="30" y="802" font-size="16" fill="#1E293B">Across my test runs the fix took 4 to 6 seconds (the Lambda's own secondsToDetect field).</text>
<text x="30" y="830" font-size="16" fill="#1E293B"><tspan font-weight="bold">Limit:</tspan> the system restores logging, it does not block the attacker's call. Two test attacks were missed and the cause was not found.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>